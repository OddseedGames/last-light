[package]
name = "oddseed-last-light"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "last-light"
path = "src/main.rs"

[dependencies]
macroquad = { version = "=0.4.16", features = ["audio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
